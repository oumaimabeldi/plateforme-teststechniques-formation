name: CI Backend Spring Boot

on:
  push:
    branches: [ main, develop ]
    paths: [ 'backend/**' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'backend/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: testtechnique
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and test with Maven
      run: |
        cd backend/backend
        mvn clean verify

    - name: Run tests
      run: |
        cd backend/backend
        mvn test

    - name: Build Docker image
      run: |
        cd backend/backend
        docker build -t myapp-backend:latest .

    - name: Test Docker image
      run: |
        docker run -d --name test-backend -p 8082:8082 \
          -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/testtechnique \
          -e SPRING_DATASOURCE_USERNAME=postgres \
          -e SPRING_DATASOURCE_PASSWORD=admin \
          myapp-backend:latest
        sleep 30
        docker logs test-backend

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results
        path: backend/backend/target/surefire-reports/