name: SonarQube Frontend Analysis

on:
  push:
    branches: [ main, develop ]
    paths: [ 'frontend/**', '.github/workflows/sonar-frontend.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'frontend/**' ]

jobs:
  analyze:
    name: Analyze with SonarQube
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Clean and install dependencies
      run: |
        cd frontend
        # Clean completely like your CI workflow
        rm -rf node_modules
        rm -f package-lock.json
        # Fresh installation with same flags
        npm install --legacy-peer-deps --force
        # Verify installed versions
        npm list ngx-monaco-editor-v2

    - name: Run tests with coverage
      run: |
        cd frontend
        npm test -- --watch=false --browsers=ChromeHeadless --code-coverage

    - name: Build application
      run: |
        cd frontend
        npm run build --prod

    - name: SonarQube Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: frontend
        args: >
          -Dsonar.projectKey=oumaimabeldi_plateforme-teststechniques-formation-frontend
          -Dsonar.organization=oumaimabeldi
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.sources=src
          -Dsonar.tests=src
          -Dsonar.sourceEncoding=UTF-8
          -Dsonar.testExecutionReportPaths=coverage/test-report.xml
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info