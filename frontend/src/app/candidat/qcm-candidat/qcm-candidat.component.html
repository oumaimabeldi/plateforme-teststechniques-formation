<div *ngIf="loading" class="text-center mt-5">
  <div class="spinner-border"></div>
</div>

<div *ngIf="!loading && qcm">
  <h3>{{ qcm.titre }}</h3>

  <form *ngIf="!submitted" (ngSubmit)="submitQcm()">
    <div *ngFor="let question of qcm.questions; let i = index" class="mb-4">
      <p><b>Q{{ i+1 }}. {{ question.enonce }}</b></p>
      <div *ngFor="let option of question.options; let j = index" class="form-check">
        <input class="form-check-input" type="radio" 
               [name]="'q' + i" [value]="j"
               [(ngModel)]="answers[i]" required>
        <label class="form-check-label">{{ option }}</label>
      </div>
    </div>

    <button type="submit" class="btn btn-success mt-3">Soumettre</button>
  </form>

  <div *ngIf="submitted" class="alert alert-info mt-4">
    {{ scoreMessage }}
    <button class="btn btn-secondary mt-3" (click)="goToMesTests()">
      Retour à mes tests
    </button>
  </div>
</div>
