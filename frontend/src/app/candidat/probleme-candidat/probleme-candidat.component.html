<div class="container mt-4">
  <h3>{{ probleme?.titre }}</h3>
  <p>{{ probleme?.description }}</p>

  <p><strong>Langage :</strong> 
    <select class="form-select w-auto d-inline ms-2"
            [(ngModel)]="selectedLanguage">
      <option *ngFor="let lang of languages" [value]="lang">{{ lang }}</option>
    </select>
  </p>

  <p><strong>Input attendu :</strong> <code>{{ probleme?.input }}</code></p>
  <p><strong>Résultat attendu :</strong> <code>{{ probleme?.expectedOutput }}</code></p>

  <h5>🖥️ Éditeur de code</h5>

 
  <ngx-monaco-editor 
      class="border rounded"
      style="height:400px"
      [(ngModel)]="code"
      [options]="editorOptions">
  </ngx-monaco-editor>

  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-warning" (click)="testerCode()">▶ Tester mon code</button>
    <button class="btn btn-success" (click)="soumettreCode()">📤 Soumettre au backend</button>
  </div>

  <div *ngIf="executionResult" class="alert alert-info mt-3">
    <strong>Résultat :</strong>
    <pre>{{ executionResult }}</pre>
  </div>
</div>
