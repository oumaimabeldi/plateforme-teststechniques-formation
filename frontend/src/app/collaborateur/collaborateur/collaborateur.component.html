<div class="d-flex min-vh-100" [ngClass]="{ 'dark-mode': isDarkMode }"> 
 
  <nav class="sidebar d-flex flex-column p-3 shadow-lg">
    <div class="text-center mb-4">
      <img src="assets/logo/Logo wevioo.png" alt="Logo" width="60" class="mb-2">
    </div>

   
    <ul class="nav flex-column nav-pills">
      <li class="nav-item mb-2">
        <a routerLink="mes-cours" routerLinkActive="active" class="nav-link">
          <i class="fas fa-edit me-2"></i> Mes cours
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="resultats" routerLinkActive="active" class="nav-link">
          <i class="fas fa-chart-bar me-2"></i> Tests
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="profil" routerLinkActive="active" class="nav-link">
          <i class="fas fa-user-circle me-2"></i> Mon Profil
        </a>
      </li>
    </ul>

    
    <div class="mt-auto border-top pt-3 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <i class="fas fa-user me-2"></i>
        <div>
          <strong>{{ collaborateur?.name }}</strong>
          <div class="text-muted" style="font-size: 0.85rem;">{{ collaborateur?.email }}</div>
        </div>
      </div>
      <button class="btn btn-sm btn-outline-secondary" (click)="toggleDarkMode()">🌙</button>
      <button (click)="logout()"><i class="fa fa-sign-out" aria-hidden="true"></i></button>
    </div>
  </nav>

  <div class="flex-grow-1 p-4 content-area">
    <router-outlet></router-outlet>
  </div>
</div>
