<div class="landing-bg">
  <div class="landing-container">
    <div class="logo-section">

      <h1 class="landing-title primary-color">Plateforme de Tests Techniques</h1>
      <p class="landing-subtitle">Évaluez et développez les compétences</p>
    </div>
    
    <div class="features-section">
      <div class="feature-card" (click)="goToLogin()">
        <h3 class="accent-color">Admin</h3>
        <p>Gestion complète des tests et utilisateurs</p>
      </div>
      <div class="feature-card" (click)="goToLogin()">
        <h3 class="accent-color">Candidat</h3>
        <p>Passer des tests techniques</p>
      </div>
      <div class="feature-card" (click)="goToLogin()">
        <h3 class="accent-color">Collaborateur</h3>

      </div>

    <div class="cta-section">
      <button class="primary-background login-btn" (click)="goToLogin()">

    </div>
  </div>
