<div class="container mt-4">
  <h3>Attribuer des tests à un candidat</h3>

  <form [formGroup]="attributionForm" (ngSubmit)="onSubmit()">
   

    <div class="mb-3">
      <label class="form-label">Candidat</label>
      <select class="form-select" formControlName="candidatId" required>
        <option value="" disabled>-- Choisir un candidat --</option>
        <option *ngFor="let c of candidats" [value]="c.id">{{ c.name }}</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">QCMs</label>
      <div *ngFor="let q of qcms">
        <input type="checkbox" (change)="onQcmChange($event, q.id)"> {{ q.titre }}
      </div>
    </div>

    
    <div class="mb-3">
      <label class="form-label">Problèmes</label>
      <div *ngFor="let p of problemes">
        <input type="checkbox" (change)="onProblemeChange($event, p.id)"> {{ p.titre }}
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Durée (minutes)</label>
      <input type="number" class="form-control" formControlName="durationMinutes" min="5">
    </div>

    <button type="submit" class="btn btn-primary">Attribuer</button>
  </form>

  <div *ngIf="successMsg" class="alert alert-success mt-3">{{ successMsg }}</div>
  <div *ngIf="errorMsg" class="alert alert-danger mt-3">{{ errorMsg }}</div>
</div>
