<div class="container mt-4">

  <h3 class="mb-3 text-center">Liste des Problèmes</h3>

  <!-- Barre de recherche -->
  <div class="input-group mb-4">
    <input type="text" [(ngModel)]="searchTerm" (input)="searchProbleme()" 
           class="form-control" placeholder="Rechercher un problème par nom...">
    <button class="btn btn-outline-secondary" (click)="searchProbleme()">🔍</button>
  </div>

  <!-- Spinner -->
  <div *ngIf="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <!-- Message si vide -->
  <div *ngIf="!loading && filteredProblemes.length === 0" class="alert alert-info text-center">
    Aucun problème trouvé.
  </div>

  <!-- Liste des problèmes sous forme de cards -->
  <div class="row g-4">
    <div class="col-md-4" *ngFor="let probleme of filteredProblemes">
      <div class="card custom-card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title">{{ probleme.titre }}</h5>
          <p class="card-text text-muted">
            {{ probleme.description || 'Pas de description disponible.' }}
          </p>
        </div>
        <div class="card-footer d-flex justify-content-between bg-white border-0">
          <button class="btn btn-sm btn-danger" (click)="deleteProbleme(probleme.id)">
            🗑 Supprimer
          </button>
        </div>
      </div>
    </div>
  </div>

</div>
