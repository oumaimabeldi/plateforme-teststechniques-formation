<div class="container mt-4">
  <!-- Candidate List Table -->
  <h3 class="mb-3" style="color: #672485;">Liste des candidats</h3>
  <div class="card shadow-sm border-0 mb-5">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table custom-table align-middle mb-0">
          <thead class="text-white" style="background-color: #672485;">
            <tr>
              <th>ID</th>
              <th>Nom</th>
              <th>Email</th>
              <th>Mot de passe</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let candidat of candidats">
              <td>{{ candidat.id }}</td>
              <td>{{ candidat.name }}</td>
              <td>{{ candidat.email }}</td>
              <td>
                <span class="me-2">réinitialiser le mot de passe</span>
                <button class="btn btn-sm btn-warning" (click)="resetPassword(candidat.id)">
                  <i class="fas fa-key"></i>
                </button>
              </td>
              <td>
                <button class="btn btn-sm text-white me-2" style="background-color: #ec9700;" (click)="editCandidat(candidat)">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn btn-sm text-white" style="background-color: #e70012;" (click)="deleteCandidat(candidat.id)">
                  <i class="fas fa-trash-alt"></i>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Editing Candidate Card -->
  <div *ngIf="editingCandidat" class="card shadow-sm border-0 mb-5">
    <div class="card-header text-white" style="background-color: #ec9700;">
      <h5 class="mb-0">Modifier le candidat</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="updateCandidat()" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nom</label>
          <input type="text" class="form-control" [(ngModel)]="editingCandidat.name" name="editName" required />
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="editingCandidat.email" name="editEmail" required />
        </div>
        <div class="col-12 text-end">
          <button type="submit" class="btn text-white me-2" style="background-color: #95c31b;">Mettre à jour</button>
          <button type="button" class="btn btn-outline-secondary" (click)="editingCandidat = null">Annuler</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add Candidate Card -->
  <div class="card shadow-sm border-0">
    <div class="card-header text-white" style="background-color: #ec9700;">
      <h5 class="mb-0">Ajouter un candidat</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="addCandidat()" #candidatForm="ngForm" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Nom</label>
          <input type="text" class="form-control" placeholder="Nom" [(ngModel)]="newCandidat.name" name="name" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="Email" [(ngModel)]="newCandidat.email" name="email" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Mot de passe</label>
          <input type="password" class="form-control" placeholder="Mot de passe" [(ngModel)]="newCandidat.password" name="password" required>
        </div>
        <div class="col-12 text-end">
          <button type="submit" class="btn text-white" style="background-color: #95c31b;">Ajouter</button>
        </div>
      </form>
    </div>
  </div>
</div>
